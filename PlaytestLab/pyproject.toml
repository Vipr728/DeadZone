[project]
name = "ryz-playtest-lab"
version = "0.1.0"
description = "Standalone headless level analysis, model comparison, and ARK integration service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "numpy>=1.26,<3",
  "onnxruntime>=1.22,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
playtest-lab = "playtest_lab.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtest_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

