# Twenty deterministic variants of every catalog scenario. Use a native SimCore adapter for authoritative generation.
dataset:
  target_tasks: 1780
  trials_per_task: {min: 3, max: 6}
  target_transitions: 3000000
  shard_size: 100000
  stopping_policy: either
generation: {workers: auto, global_seed: 0}
solver:
  high_budget: {beam_width: 64, max_depth: 150}
  low_budget: {beam_width: 8, max_depth: 50}
sources: {calibration: true, high_budget_solver: true, low_budget_solver: true, perturbations: true, random_exploration: true, policy_rollouts: true}
