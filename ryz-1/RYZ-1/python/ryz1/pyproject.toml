[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ryz1"
version = "0.1.0"
description = "RYZ-1 local GB10 training and evaluation tools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "tensorboard>=2.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]

[project.scripts]
ryz1-validate-dataset = "ryz1.data.schema:main"
ryz1-train = "ryz1.training.train:main"
ryz1-evaluate = "ryz1.evaluation.evaluate:main"
ryz1-export = "ryz1.export.onnx_export:main"

[tool.setuptools.packages.find]
where = ["src"]
