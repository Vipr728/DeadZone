[project]
name = "playtester-rl"
version = "0.1.0"
description = "Compositional RL playtesting agent — ML/RL workstream (piece-composition gym, reward strategies, telemetry, gate evaluation)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "filelock>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtester_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
