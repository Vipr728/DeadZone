# mlagents-learn hyperparameters — prd-ml.md §1. This is a real ML-Agents trainer
# config file, consumed directly by `mlagents-learn rl/configs/training_config.yaml ...`
# on the machine with the separate mlagents venv (see rl/README.md).
#
# env_settings.num_envs is tuned to the measured parallel count. The remote
# orchestration changes process placement (Mac Unity, GB10 policy) without
# changing this production trainer definition.

behaviors:
  PlaytestAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048       # TUNABLE — raise on GB10 for large-batch policy update claim (spec §6)
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 2000000       # TUNABLE — Stage 1; Stage 2 fine-tune uses a much smaller override
    time_horizon: 128
    summary_freq: 10000

env_settings:
  num_envs: 1                # [laptop-ok]=1-4, [gb10-only]=raise to real achieved parallel count
  base_port: 5005

engine_settings:
  no_graphics: true           # headless training per spec §2.7
