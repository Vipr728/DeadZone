# Tracked one-batch GB10 transport smoke. This proves the remote communicator,
# CUDA selection, checkpoint, and ONNX seams; it is not convergence evidence.
behaviors:
  PlaytestAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 8
      buffer_size: 32
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 1
    network_settings:
      normalize: true
      hidden_units: 32
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 1
    max_steps: 64
    time_horizon: 16
    summary_freq: 16

env_settings:
  num_envs: 1
  base_port: 5004

engine_settings:
  no_graphics: true
