# Piece-composition gym config — prd-ml.md §1.
# All ranges here are TUNABLE starting defaults. Once Rahul's player controller exists,
# measured move-speed/jump-arc numbers get written directly into this file (see PRD.md
# "Async-independence guarantee": this file *is* the handoff, not a conversation).

pieces:
  gap_jump:
    enabled: true
    # TUNABLE — tiles. Derived from an assumed player horizontal jump distance of ~6
    # tiles at default move speed 5 u/s + jump arc ~0.5s apex; 5.0 leaves a safety
    # margin below max clearable distance. RE-DERIVE once the real controller exists.
    width_range: [2.0, 5.0]
  move_to_goal:
    enabled: true
    # TUNABLE — tiles, arbitrary flat traversal length.
    distance_range: [4.0, 10.0]
  elevation:
    enabled: false  # feature flag — flip true if hour 4-8 review has slack (spec §8.4)
    # TUNABLE — tiles, must stay under max jump height.
    height_range: [1.0, 3.0]

composition:
  pieces_per_episode: 3        # LOCKED — spec §8.2, do not change
  boundary_velocity_reset: true  # LOCKED — spec §8.3, do not change
