# Reward strategy config — prd-ml.md §1. Switching active_strategy is the ENTIRE
# Gate 1 fallback action (PRD.md §1 modularity rule) — no code change required.

active_strategy: compositional  # "compositional" | "single_gym_fallback"

compositional:
  # TUNABLE — per-step, multiplied by forward progress delta toward current piece's
  # local goal (clamped >= 0, no reward for backing up).
  progress_reward_scale: 0.01
  # TUNABLE — per-step constant, discourages stalling.
  time_penalty: -0.001
  # TUNABLE — fires once per piece via OnTriggerEnter2D on piece-goal collider.
  piece_completion_bonus: 1.0
  # TUNABLE — fires once on completing the 3rd (final) piece.
  final_sequence_bonus: 5.0
  # TUNABLE — fires on hazard/fall-off collider, calls EndEpisode().
  death_penalty: -1.0

single_gym_fallback:
  progress_reward_scale: 0.01
  time_penalty: -0.001
  completion_bonus: 1.0
  death_penalty: -1.0

episode:
  max_steps: 1000  # TUNABLE — ML-Agents episode step cap before forced timeout
