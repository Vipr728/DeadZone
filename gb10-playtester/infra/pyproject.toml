[project]
name = "playtester-infra"
version = "0.1.0"
description = "Local report generation and orchestration for the GB10 playtester MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema[format]>=4.23,<5",
  "pyyaml>=6.0,<7",
]

[project.scripts]
playtester-report = "playtester_infra.cli:report_main"
playtester-watch = "playtester_infra.cli:watch_main"
playtester-egress-proof = "playtester_infra.cli:egress_main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playtester_infra"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires explicitly enabled external integration services",
  "ollama: requires a live local Ollama service",
]
